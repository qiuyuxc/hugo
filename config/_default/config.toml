# Change baseurl before deploy
baseurl = "https://www.kukie.cn/"
locale  = "zh-cn"
title   = "Kukie的个人笔记"

# Theme i18n support
# See all available values at https://github.com/CaiJimmy/hugo-theme-stack/tree/master/i18n
defaultContentLanguage = "zh-cn"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = true

# Change it to your Disqus shortname before using
disqusShortname = "hugo-theme-stack"

# Explicitly register the zh-cn language so Hugo loads zh.toml translations.
[languages]
    [languages.zh-cn]
        label = "简体中文"
        weight = 1

[pagination]
    pagerSize = 5

# 背景图配置（支持 PC/手机端分别设置，填 assets/img/ 下文件或 CDN URL，留空关闭）
[params.background]
    enable = true
    src_desktop = "https://pic.kukie.cn/ri/h/844.webp"
    src_mobile  = "https://pic.kukie.cn/ri/v/452.webp"
    opacity = 0.15
    size    = "cover"
    position = "center"
    repeat  = "no-repeat"
    attachment = "fixed"
